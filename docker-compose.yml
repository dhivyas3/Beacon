# QA Hub: `docker compose up --build` starts the whole system on http://localhost:8080.
# Copy .env.example to .env first and set WEBHOOK_SIGNING_SECRET and the SEED_ADMIN_* values.

x-app-env: &app-env
  NODE_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: postgresql://qahub:${POSTGRES_PASSWORD:-qahub}@postgres:5432/qahub
  REDIS_URL: redis://redis:6379
  PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
  STORAGE_DIR: /data/storage
  WEBHOOK_SIGNING_SECRET: ${WEBHOOK_SIGNING_SECRET:?Set WEBHOOK_SIGNING_SECRET in .env (16+ characters)}
  MAX_PAGES: ${MAX_PAGES:-2000}
  PAGE_CONCURRENCY: ${PAGE_CONCURRENCY:-5}
  LINK_CONCURRENCY: ${LINK_CONCURRENCY:-10}
  EXTERNAL_LINK_CONCURRENCY: ${EXTERNAL_LINK_CONCURRENCY:-3}
  EXTERNAL_HOST_DELAY_MS: ${EXTERNAL_HOST_DELAY_MS:-500}
  MAX_CONCURRENT_SCANS: ${MAX_CONCURRENT_SCANS:-3}
  SCAN_RATE_LIMIT_RPS: ${SCAN_RATE_LIMIT_RPS:-10}
  FORM_TEST_EMAIL: ${FORM_TEST_EMAIL:-qa-test@example.com}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: qahub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qahub}
      POSTGRES_DB: qahub
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U qahub -d qahub']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    environment:
      <<: *app-env
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-120}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-Admin}
    volumes:
      - storage:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  worker:
    build:
      context: .
      target: worker
    restart: unless-stopped
    # Chromium needs more shared memory than Docker's 64 MB default, and a proper init process to
    # reap the browser processes it starts.
    shm_size: '1gb'
    init: true
    environment: *app-env
    volumes:
      - storage:/data/storage
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    ports:
      - '${WEB_PORT:-8080}:80'
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  storage:

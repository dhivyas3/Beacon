<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Email not validated</title>
    <meta name="description" content="Fixture page: the script only checks the email is not empty." />
    <link rel="canonical" href="{{ORIGIN}}/form-lax-email" />
    <meta property="og:title" content="Email not validated" />
    <meta property="og:description" content="Fixture." />
    <meta property="og:image" content="{{ORIGIN}}/images/ok.svg" />
  </head>
  <body>
    <main>
      <h1>Email not validated</h1>
      <form id="f" action="/api/forms/good" method="post" novalidate>
        <label>Email <input type="email" name="email" required /></label>
        <button type="submit">Subscribe</button>
      </form>
      <p id="status" role="status"></p>
      <p><a href="/">Home</a></p>
    </main>
    <script>
      // Checks that something was typed, but not that it is an address.
      var form = document.getElementById("f");
      form.addEventListener("submit", function (event) {
        event.preventDefault();
        if (!form.elements.email.value) return;
        fetch(form.action, { method: "POST", body: new FormData(form) }).then(function () {
          document.getElementById("status").textContent = "Subscribed.";
        });
      });
    </script>
  </body>
</html>

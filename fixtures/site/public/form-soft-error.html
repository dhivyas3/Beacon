<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Form that says sorry</title>
    <meta name="description" content="Fixture page: Form that says sorry." />
    <link rel="canonical" href="{{ORIGIN}}/form-soft-error" />
    <meta property="og:title" content="Form that says sorry" />
    <meta property="og:description" content="Form that says sorry." />
    <meta property="og:image" content="{{ORIGIN}}/images/ok.svg" />
  </head>
  <body>
    <main>
      <h1>Form that says sorry</h1>
      <form id="f" action="/api/forms/soft-error" method="post">
        <label>Name <input type="text" name="name" required /></label>
        <label>Email <input type="email" name="email" required /></label>
        <button type="submit">Send</button>
      </form>
      <p id="status" role="status"></p>
      <p><a href="/">Home</a></p>
    </main>
    <script>
      var form = document.getElementById("f");
      form.addEventListener("submit", function (event) {
        event.preventDefault();
        fetch(form.action, { method: "POST", body: new FormData(form) }).then(function (response) {
          document.getElementById("status").textContent = "Sorry, something went wrong. Please try again.";
        });
      });
    </script>
  </body>
</html>

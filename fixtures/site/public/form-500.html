<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Form that fails</title>
    <meta name="description" content="A form whose endpoint returns 500." />
    <link rel="canonical" href="{{ORIGIN}}/form-500" />
    <meta property="og:title" content="Failing form" />
    <meta property="og:description" content="Form." />
    <meta property="og:image" content="{{ORIGIN}}/images/ok.svg" />
  </head>
  <body>
    <main>
      <h1>Form that fails</h1>
      <form id="callback" action="/api/forms/500" method="post">
        <label>Name <input type="text" name="name" required /></label>
        <label>Email <input type="email" name="email" required /></label>
        <button type="submit">Request a call back</button>
      </form>
      <p id="status" role="status"></p>
      <p><a href="/">Home</a></p>
    </main>
    <script>
      var form = document.getElementById('callback');
      form.addEventListener('submit', function (event) {
        event.preventDefault();
        fetch(form.action, { method: 'POST', body: new FormData(form) }).then(function (response) {
          document.getElementById('status').textContent = response.ok
            ? 'Thanks, we will call you back.'
            : '';
        });
      });
    </script>
  </body>
</html>
